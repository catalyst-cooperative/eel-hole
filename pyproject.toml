[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eel-hole"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask-htmx>=0.4.0",
    "flask>=3.1.0",
    "frictionless>=5.19",
    "pyyaml>=6.0.2",
    "pydantic>=2.13",
    "duckdb>=1.5.6",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.7",
    "psycopg2-binary>=2.9.10",
    "authlib>=1.6.9",
    "docutils>=0.21.2",
    "structlog>=25.1.0",
    "requests>=2.34",
    "markupsafe>=3.0.2",
    "rapidfuzz>=3.14.1",
    "whoosh-reloaded>=2.7.5",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
# Use uv's own Python builds so every developer and CI run gets the same
# interpreter. The Dockerfile deliberately overrides this with
# UV_PYTHON_PREFERENCE=only-system / UV_PYTHON_DOWNLOADS=never to use the
# base image's Python instead.
python-preference = "only-managed"
python-downloads = "automatic"
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "playwright>=1.63",
    "prek>=0.5.5",
    "pytest>=9.1",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.7.1",
]

[tool.setuptools]
packages = ["eel_hole"]
